<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola Mundo DevOps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 64px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 12px; }
    p  { color: #94a3b8; font-size: 1rem; margin-bottom: 32px; }
    .info {
      display: flex;
      gap: 32px;
      justify-content: center;
      font-size: 0.85rem;
      color: #64748b;
    }
    .info span { display: flex; flex-direction: column; gap: 4px; }
    .info strong { color: #cbd5e1; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Desplegado con CI/CD</div>
    <h1>Hola Mundo DevOps</h1>
    <p>Dummy A — Sitio estático servido por NGINX · UCU Lab 06</p>
    <div class="info">
      <span><strong>Plataforma</strong>Azure Ubuntu VM</span>
      <span><strong>Pipeline</strong>GitHub Actions</span>
      <span><strong>Servidor</strong>NGINX</span>
    </div>
  </div>
</body>
</html>
